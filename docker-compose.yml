# Orquestación unificada (Single Compose)
# PC origen : docker compose up --build        (construye la imagen local)
# PC destino: docker compose pull && docker compose up -d   (descarga de Docker Hub)
name: ${COMPOSE_PROJECT_NAME:-microapp}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Con "pull" se usa la imagen de Docker Hub; con "--build" se construye localmente
    image: ${DOCKERHUB_USER}/${APP_NAME}-backend:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - static_data:/app/staticfiles

  frontend:
    # Node fijado a la versión del .nvmrc, sin depender del Node del host
    image: node:24.21.0-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_data:
  frontend_node_modules:
